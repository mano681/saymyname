    <script>
        const languagesList = [
            { code: "ja", name: "Japanese" }, { code: "ko", name: "Korean" }, { code: "ar", name: "Arabic" }, { code: "el", name: "Greek" },
            { code: "zh", name: "Chinese" }, { code: "ru", name: "Russian" }, { code: "hi", name: "Hindi" }, { code: "fr", name: "French" },
            { code: "es", name: "Spanish" }, { code: "de", name: "German" }, { code: "it", name: "Italian" }, { code: "tr", name: "Turkish" },
            { code: "ur", name: "Urdu" }, { code: "fa", name: "Persian" }, { code: "he", name: "Hebrew" }, { code: "th", name: "Thai" },
            { code: "vi", name: "Vietnamese" }, { code: "bn", name: "Bengali" }, { code: "pa", name: "Punjabi" }, { code: "mr", name: "Marathi" },
            { code: "ta", name: "Tamil" }, { code: "te", name: "Telugu" }, { code: "gu", name: "Gujarati" }, { code: "kn", name: "Kannada" },
            { code: "ml", name: "Malayalam" }, { code: "am", name: "Amharic" }, { code: "hy", name: "Armenian" }, { code: "az", name: "Azerbaijani" },
            { code: "eu", name: "Basque" }, { code: "be", name: "Belarusian" }, { code: "bs", name: "Bosnian" }, { code: "bg", name: "Bulgarian" },
            { code: "ca", name: "Catalan" }, { code: "hr", name: "Croatian" }, { code: "cs", name: "Czech" }, { code: "da", name: "Danish" },
            { code: "nl", name: "Dutch" }, { code: "eo", name: "Esperanto" }, { code: "et", name: "Estonian" }, { code: "fi", name: "Finnish" },
            { code: "gl", name: "Galician" }, { code: "ka", name: "Georgian" }, { code: "hu", name: "Hungarian" }, { code: "is", name: "Icelandic" },
            { code: "id", name: "Indonesian" }, { code: "ga", name: "Irish" }, { code: "kk", name: "Kazakh" }, { code: "km", name: "Khmer" },
            { code: "ky", name: "Kyrgyz" }, { code: "lo", name: "Lao" }, { code: "lv", name: "Latvian" }, { code: "lt", name: "Lithuanian" },
            { code: "mk", name: "Macedonian" }, { code: "ms", name: "Malay" }, { code: "mn", name: "Mongolian" }, { code: "my", name: "Myanmar" },
            { code: "ne", name: "Nepali" }, { code: "no", name: "Norwegian" }, { code: "pl", name: "Polish" }, { code: "pt", name: "Portuguese" },
            { code: "ro", name: "Romanian" }, { code: "sr", name: "Serbian" }, { code: "si", name: "Sinhala" }, { code: "sk", name: "Slovak" },
            { code: "sl", name: "Slovenian" }, { code: "sw", name: "Swahili" }, { code: "sv", name: "Swedish" }, { code: "tg", name: "Tajik" },
            { code: "uk", name: "Ukrainian" }, { code: "uz", name: "Uzbek" }, { code: "cy", name: "Welsh" }, { code: "yi", name: "Yiddish" },
            { code: "af", name: "Afrikaans" }, { code: "sq", name: "Albanian" }, { code: "ceb", name: "Cebuano" }, { code: "ny", name: "Chichewa" },
            { code: "co", name: "Corsican" }, { code: "fyr", name: "Frisian" }, { code: "ht", name: "Haitian Creole" }, { code: "ha", name: "Hausa" },
            { code: "haw", name: "Hawaiian" }, { code: "hmn", name: "Hmong" }, { code: "ig", name: "Igbo" }, { code: "jw", name: "Javanese" },
            { code: "ku", name: "Kurdish" }, { code: "la", name: "Latin" }, { code: "lb", name: "Luxembourgish" }, { code: "mg", name: "Malagasy" },
            { code: "mt", name: "Maltese" }, { code: "mi", name: "Maori" }, { code: "ps", name: "Pashto" }, { code: "sm", name: "Samoan" },
            { code: "gd", name: "Scots Gaelic" }, { code: "st", name: "Sesotho" }, { code: "sn", name: "Shona" }, { code: "sd", name: "Sindhi" },
            { code: "su", name: "Sundanese" }, { code: "tl", name: "Tagalog" }, { code: "so", name: "Somali" }, { code: "xh", name: "Xhosa" },
            { code: "zu", name: "Zulu" }, { code: "yo", name: "Yoruba" }
        ];

        const grid = document.getElementById('languageGrid');
        languagesList.sort((a,b) => a.name.localeCompare(b.name)).forEach(lang => {
            const label = document.createElement('label');
            label.className = "flex items-center p-1 border-2 border-black rounded cursor-pointer bg-gray-50 hover:bg-pink-50 text-sm font-bold";
            const isDefault = ['Japanese', 'Korean', 'Arabic', 'Greek', 'Hindi', 'Urdu', 'French'].includes(lang.name);
            label.innerHTML = `<input type="checkbox" value="${lang.code}" data-name="${lang.name}" ${isDefault ? 'checked' : ''} class="lang-opt w-4 h-4 mr-1.5 accent-pink-600"> ${lang.name}`;
            grid.appendChild(label);
        });

        document.getElementById('selectAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.lang-opt').forEach(cb => cb.checked = true);
            playSound('blipSound');
        });
        document.getElementById('clearAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.lang-opt').forEach(cb => cb.checked = false);
            playSound('blipSound');
        });

        const playSound = (id) => {
            const sound = document.getElementById(id);
            if(sound) { sound.currentTime = 0; sound.play().catch(()=>{}); }
        };

        function typeWriter(text, elementId, speed = 40, callback) {
            let i = 0;
            const element = document.getElementById(elementId);
            element.innerHTML = "";
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    if(i % 2 === 0) playSound('blipSound');
                    setTimeout(type, speed);
                } else if (callback) {
                    callback();
                }
            }
            type();
        }

        const sceneSplash = document.getElementById('sceneSplash');
        const sceneGuide = document.getElementById('sceneGuide');
        const sceneCurtains = document.getElementById('sceneCurtains');
        const leftCurtain = document.getElementById('leftCurtain');
        const rightCurtain = document.getElementById('rightCurtain');
        const nextBtn = document.getElementById('nextBtn');

        const lines = [
            "Welcome to SAY MY NAME ...",
            "...a cozy corner to see how your name looks across global dimensions.",
            "Let's enter the cherry blossom sanctuary."
        ];
        let currentLineIndex = 0;

        sceneSplash.addEventListener('click', () => {
            playSound('blipSound');
            const bgMusic = document.getElementById('bgMusic');
            if (bgMusic) { bgMusic.volume = 0.15; bgMusic.play().catch(()=>{}); } // Sets a soft, low cozy volume (15%)

            sceneSplash.classList.add('opacity-0');
            setTimeout(() => {
                sceneSplash.classList.add('hidden');
                sceneGuide.classList.remove('hidden');
                runDialogue();
            }, 1000);
        });

        const voiceMap = {
            0: 'voiceWelcome',
            1: 'voiceCozy',
            2: 'voiceEnterName'
        };

        function runDialogue() {
            nextBtn.classList.add('hidden');
            
            const currentVoiceId = voiceMap[currentLineIndex];
            playSound(currentVoiceId);

            typeWriter(lines[currentLineIndex], 'dialogueText', 45, () => {
                nextBtn.classList.remove('hidden');
            });
        }

        nextBtn.addEventListener('click', () => {
            playSound('blipSound');
            currentLineIndex++;
            if (currentLineIndex < lines.length) {
                runDialogue();
            } else {
                triggerCurtainTransition();
            }
        });

        function triggerCurtainTransition() {
            sceneCurtains.classList.remove('hidden');
            playSound('curtainSound');
            leftCurtain.style.transform = 'translateX(0)';
            rightCurtain.style.transform = 'translateX(0)';

            setTimeout(() => {
                sceneGuide.classList.add('hidden');
                leftCurtain.style.transform = 'translateX(-100%)';
                rightCurtain.style.transform = 'translateX(100%)';
                setTimeout(() => { sceneCurtains.classList.add('hidden'); }, 1000);
            }, 1200);
        }

        // --- TRANSLATION API HANDLING & MODAL MANAGEMENT ---
        const travelBtn = document.getElementById('travelBtn');
        const nameInput = document.getElementById('nameInput');
        const resultsWrapper = document.getElementById('resultsWrapper');
        const statusDisplay = document.getElementById('characterStatus');
        const clickHint = document.getElementById('clickHint');

        const popupModal = document.getElementById('popupModal');
        const modalLangTitle = document.getElementById('modalLangTitle');
        const modalBigName = document.getElementById('modalBigName');
        const closeModalBtn = document.getElementById('closeModalBtn');

        travelBtn.addEventListener('click', async () => {
            const queryName = nameInput.value.trim();
            if (!queryName) {
                alert("Please enter a target name first!");
                return;
            }

            const selectedBoxes = Array.from(document.querySelectorAll('.lang-opt:checked'));
            if (selectedBoxes.length === 0) {
                alert("Please select at least one language!");
                return;
            }

            playSound('voiceCuteName');

            statusDisplay.innerText = "Status: Translating... ✏️";
            resultsWrapper.innerHTML = "";
            resultsWrapper.classList.remove('hidden');
            clickHint.classList.add('hidden');

            for (let i = 0; i < selectedBoxes.length; i++) {
                const langCode = selectedBoxes[i].value;
                const langName = selectedBoxes[i].getAttribute('data-name');

                try {
                    const response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${langCode}&dt=t&q=${encodeURIComponent(queryName)}`);
                    const data = await response.json();
                    const translatedResult = data[0][0][0];

                    const row = document.createElement('div');
                    row.className = "flex justify-between items-center bg-white border-2 border-black p-2 rounded shadow-[2px_2px_0px_rgba(0,0,0,1)] text-base font-bold cursor-pointer hover:bg-yellow-50 transition-colors duration-100";
                    row.innerHTML = `<span class="text-gray-700">${langName}:</span> <span class="text-pink-600 font-extrabold text-lg">${translatedResult}</span>`;
                    
                    row.addEventListener('click', () => {
                        playSound('blipSound');
                        modalLangTitle.innerText = langName.toUpperCase();
                        modalBigName.innerText = translatedResult;
                        popupModal.classList.remove('hidden');
                        popupModal.classList.add('flex');
                    });

                    resultsWrapper.appendChild(row);
                    playSound('blipSound');
                } catch (error) {
                    console.error("API mapping failure:", error);
                }
            }

            statusDisplay.innerText = "Status: Done! ✨";
            playSound('successSound');
            clickHint.classList.remove('hidden');
        });

        const closeBox = () => {
            playSound('blipSound');
            popupModal.classList.add('hidden');
            popupModal.classList.remove('flex');
        };
        closeModalBtn.addEventListener('click', closeBox);
        popupModal.addEventListener('click', (e) => { if(e.target === popupModal) closeBox(); });

        document.querySelectorAll('.fallback-avatar').forEach(img => {
            img.onerror = function() {
                this.src = "https://api.dicebear.com/7.x/pixel-art/svg?seed=cherry";
            };
        });
    </script>
